<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1F1B16" />
    <title>試作：障害突破ラン</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" />
    <style>
      :root { --paper:#f5efe3; --card:#fffdf6; --ink:#1f1b16; --sub:#5a5045; --tomato:#e4553a; --mint:#6fc3a0; --mustard:#e9b23e; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: 'Zen Maru Gothic', sans-serif; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
      button { font-family: inherit; color: var(--ink); }
      #app { display: flex; flex-direction: column; height: 100dvh; max-width: 1100px; margin: 0 auto; }
      header { padding: 8px 14px 6px; background: var(--card); border-bottom: 2px solid var(--ink); display: flex; flex-direction: column; gap: 5px; }
      .row { display: flex; align-items: center; gap: 8px; }
      .chip { padding: 2px 10px; border: 2px solid var(--ink); border-radius: 999px; background: var(--mustard); font-size: 12px; font-weight: 900; }
      #h-station { font-size: 14px; font-weight: 900; }
      #h-clock { margin-left: auto; font-family: 'Dela Gothic One', sans-serif; font-size: 16px; }
      .sub { font-size: 12px; font-weight: 700; gap: 10px; }
      #h-delay.late { color: #b53e28; }
      .gauge { width: 54px; height: 9px; border: 1.5px solid var(--ink); border-radius: 5px; overflow: hidden; background: var(--card); display: inline-block; vertical-align: middle; margin-left: 3px; }
      .gauge i { display: block; height: 100%; }
      #g-delay { background: var(--tomato); }
      #g-trust { background: var(--mint); }
      #h-money { margin-left: auto; font-weight: 900; }
      #h-mods { font-size: 11px; font-weight: 900; color: #2e6b53; }
      main { position: relative; flex: 1; min-height: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #btn-mode { position: absolute; right: 10px; top: 62px; padding: 7px 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--card); font-weight: 900; font-size: 13px; box-shadow: 0 3px 0 var(--ink); }
      #h-speed { position: absolute; left: 12px; top: 62px; font-family: 'Dela Gothic One', sans-serif; font-size: 24px; pointer-events: none; }
      #toasts { position: absolute; top: 104px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 5px; align-items: center; pointer-events: none; width: 92%; }
      .toast { padding: 5px 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--card); font-weight: 900; font-size: 13px; text-align: center; }
      .toast.bad { background: var(--tomato); color: #fffdf6; }
      .toast.good { background: #dff2e8; }
      #shock { position: absolute; left: 0; right: 0; top: 34%; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; opacity: 0; }
      #shock.show { animation: shock 2.2s ease-out forwards; }
      #shock .lbl { padding: 3px 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--mustard); font-weight: 900; font-size: 13px; }
      #shock .num { font-family: 'Dela Gothic One', sans-serif; font-size: 54px; color: var(--tomato); -webkit-text-stroke: 2px var(--ink); transform: rotate(-4deg); }
      #shock .flew { padding: 4px 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--tomato); color: #fffdf6; font-weight: 900; }
      #shock .safe { padding: 4px 12px; border: 2px solid var(--ink); border-radius: 10px; background: var(--mint); font-weight: 900; }
      @keyframes shock { 0% { opacity: 0; transform: scale(1.6); } 8% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
      .ripple { position: fixed; width: 50px; height: 50px; margin: -25px 0 0 -25px; border: 3px solid var(--tomato); border-radius: 50%; pointer-events: none; animation: rip 0.4s ease-out forwards; z-index: 30; }
      @keyframes rip { from { transform: scale(0.3); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
      footer { padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); background: var(--card); border-top: 2px solid var(--ink); display: flex; flex-direction: column; gap: 8px; }
      #items { display: flex; gap: 6px; }
      .item { flex: 1; min-width: 0; display: flex; align-items: center; gap: 5px; padding: 5px 6px; border: 2px solid var(--ink); border-radius: 10px; background: var(--card); text-align: left; }
      .item .ic { width: 26px; height: 26px; border: 2px solid var(--ink); border-radius: 7px; display: grid; place-items: center; font-weight: 900; font-size: 13px; flex: none; }
      .item .nm { font-size: 11px; font-weight: 900; line-height: 1.2; min-width: 0; }
      .item .nm small { display: block; font-size: 9.5px; font-weight: 700; color: var(--sub); }
      .item .ct { margin-left: auto; font-weight: 900; font-size: 12px; }
      .item:disabled { opacity: 0.4; }
      .item.armed { background: var(--mustard); box-shadow: 0 0 0 3px rgba(233,178,62,0.5); }
      #lever { display: grid; grid-template-columns: 1.3fr repeat(7, 1fr); gap: 4px; touch-action: none; }
      .notch { height: 52px; border: 2px solid var(--ink); border-radius: 10px; background: var(--card); font-weight: 900; font-size: 14px; padding: 0; }
      .notch.brake { background: #fbe3dc; } .notch.power { background: #dff2e8; } .notch.eb { background: #f5c6b8; }
      .notch.on { transform: translateY(-4px); box-shadow: 0 4px 0 var(--ink); }
      .notch.brake.on { background: var(--tomato); color: #fffdf6; } .notch.power.on { background: var(--mint); } .notch:not(.brake):not(.power).on { background: var(--mustard); }
      #dwell { display: none; flex-direction: column; gap: 8px; }
      body.dwell #dwell { display: flex; } body.dwell #run { display: none; }
      #run { display: flex; flex-direction: column; gap: 8px; }
      .dhead { display: flex; align-items: baseline; gap: 10px; }
      .dhead b { font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 18px; }
      #seats { font-size: 12px; font-weight: 900; }
      #cands { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 5px; padding-top: 6px; }
      @media (min-width: 700px) { #cands { grid-template-columns: repeat(7, 1fr); } }
      .cand { position: relative; min-width: 0; padding: 6px 3px 5px; border: 2px solid var(--ink); border-radius: 11px; background: var(--card); display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .cand.sel { border: 3px solid #2e8f62; background: #ddf3e6; box-shadow: 0 0 0 3px rgba(111,195,160,0.45); }
      .cand.req:not(.sel) { background: #fff4da; }
      .cand .flag { position: absolute; right: -4px; top: -9px; padding: 0 6px; border: 1.5px solid var(--ink); border-radius: 999px; background: #2e8f62; color: #fffdf6; font-size: 10px; font-weight: 900; }
      .cand .flag.req { background: var(--mustard); color: var(--ink); }
      .cand .ic { width: 26px; height: 26px; border: 2px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 13px; }
      .cand b { font-size: 11.5px; } .cand b small { font-size: 9px; margin-left: 2px; color: #b53e28; }
      .cand .dest { display: flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; }
      .cand .dest i { width: 9px; height: 9px; border: 1.5px solid var(--ink); border-radius: 50%; }
      .cand .nums { display: flex; gap: 5px; font-size: 11px; font-weight: 900; } .cand .tol { color: #3f62cf; }
      .cand .note { font-size: 9px; font-weight: 700; color: var(--sub); text-align: center; line-height: 1.25; }
      #btn-depart { min-height: 52px; border: 2.5px solid var(--ink); border-radius: 14px; background: var(--tomato); color: #fffdf6; box-shadow: 3px 3px 0 var(--ink); font-size: 18px; font-weight: 900; }
      #btn-depart:disabled { opacity: 0.5; }
      #offer { position: fixed; inset: 0; background: rgba(31,27,22,0.45); display: grid; place-items: center; padding: 16px; z-index: 20; }
      #offer[hidden], #result[hidden] { display: none; }
      .obox { width: min(420px, 100%); background: var(--card); border: 2.5px solid var(--ink); border-radius: 16px; padding: 16px; box-shadow: 0 6px 0 var(--ink); display: flex; flex-direction: column; gap: 10px; }
      .obox h3 { margin: 0; font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: 20px; }
      .obox p { margin: 0; font-size: 12px; font-weight: 700; color: var(--sub); }
      #offer-cards { display: flex; flex-direction: column; gap: 8px; }
      .ocard { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 2px solid var(--ink); border-radius: 12px; background: #fffdf6; text-align: left; font-size: 12px; font-weight: 700; }
      .ocard b { font-size: 16px; }
      .ocard .tag { align-self: flex-start; padding: 0 8px; border: 1.5px solid var(--ink); border-radius: 999px; font-size: 10px; font-weight: 900; background: #dff2e8; }
      .ocard.mod .tag { background: var(--mustard); }
      #result { position: fixed; inset: 0; background: rgba(31,27,22,0.55); display: grid; place-items: center; padding: 16px; z-index: 25; }
      dl { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 0; font-weight: 700; } dd { margin: 0; text-align: right; font-weight: 900; }
      #retry { height: 48px; border: 2px solid var(--ink); border-radius: 12px; background: var(--mint); font-weight: 900; font-size: 16px; box-shadow: 0 4px 0 var(--ink); }
      body.inside #items { display: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="row"><span class="chip">江ノ島電鉄</span><span id="h-station"></span><span id="h-clock"></span></div>
        <div class="row sub"><span id="h-delay"></span><span class="gauge"><i id="g-delay"></i></span><span>信頼<span class="gauge"><i id="g-trust"></i></span> <b id="h-trust"></b></span><span id="h-money"></span></div>
        <div id="h-mods"></div>
      </header>
      <main>
        <canvas id="view"></canvas>
        <div id="h-speed"></div>
        <button id="btn-mode" type="button">車内へ ▶</button>
        <div id="shock"></div>
        <div id="toasts"></div>
      </main>
      <footer>
        <div id="run">
          <div id="items"></div>
          <div id="lever" aria-label="マスコン"></div>
        </div>
        <div id="dwell">
          <div class="dhead"><b>乗せる客を選ぶ</b><span id="seats"></span></div>
          <div id="cands"></div>
          <button id="btn-depart" type="button">発車 ▶</button>
        </div>
      </footer>
    </div>
    <div id="offer" hidden>
      <div class="obox"><h3>3択：ひとつ選ぶ</h3><p>選んでいる間も時計は進む</p><div id="offer-cards"></div></div>
    </div>
    <div id="result" hidden>
      <div class="obox"><h3 id="result-title"></h3><p id="result-reason"></p><dl id="result-stats"></dl><button id="retry" type="button">もう一度</button></div>
    </div>
    <script type="module" src="/src/proto/run/main.ts"></script>
  </body>
</html>
